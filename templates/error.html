{% extends "base.html" %}

{% block title %}Error {{ code }} - Tamper-Proof Certificate System{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="display-1 fw-bold text-danger mb-3">{{ code }}</div>
        <h3 class="fw-bold mb-3">Oops! Something went wrong</h3>
        <p class="text-muted mb-4">{{ message }}</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('dashboard') if current_user else url_for('verify') }}" class="btn btn-primary">
                <i class="bi bi-house-door me-1"></i> Return Home
            </a>
            <a href="{{ url_for('verify') }}" class="btn btn-outline-secondary">
                <i class="bi bi-qr-code-scan me-1"></i> Verification Portal
            </a>
        </div>
    </div>
</div>
{% endblock %}
