{% extends "base.html" %}

{% block title %}Register Admin - Tamper-Proof Certificate System{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm p-4">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center p-3 mb-3" style="width: 64px; height: 64px;">
                    <i class="bi bi-person-plus-fill fs-2 text-warning"></i>
                </div>
                <h3 class="fw-bold">Create Admin Account</h3>
                <p class="text-muted small">Register a new administrator to issue and manage certificates</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                        <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Dr. Ramesh Gupta" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="admin@institute.edu" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-at"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                    </div>
                </div>

                <div class="row g-2 mb-4">
                    <div class="col-md-6">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Min. 6 characters" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-check2-circle"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                    <i class="bi bi-person-check-fill me-1"></i> Register Account
                </button>
            </form>

            <div class="text-center mt-2">
                <span class="small text-muted">Already registered?</span>
                <a href="{{ url_for('login') }}" class="small text-decoration-none fw-bold ms-1">Sign in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
